name: Marketplace Connector Validation

on:
  pull_request:
    paths:
      - 'marketplace/connectors/**'

jobs:
  validate-connectors:
    name: Validate connector.json files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install ajv-cli and required formats
        run: npm install --no-save ajv-cli@5 ajv-formats@3

      - name: Validate connector definitions
        run: |
          set -e
          SCHEMA="marketplace/schema/connector-definition.schema.json"
          FAILED=0
          PASSED=0

          echo "Scanning marketplace/connectors/ for connector.json files..."

          while IFS= read -r connector_file; do
            echo ""
            echo "Validating: $connector_file"
            if npx ajv validate \
                --spec=draft2020 \
                -s "$SCHEMA" \
                -d "$connector_file" \
                --strict=false 2>&1; then
              echo "  PASS: $connector_file"
              PASSED=$((PASSED + 1))
            else
              echo "  FAIL: $connector_file"
              FAILED=$((FAILED + 1))
            fi
          done < <(find marketplace/connectors -name "connector.json" | sort)

          echo ""
          echo "Results: $PASSED passed, $FAILED failed"

          if [ "$FAILED" -gt 0 ]; then
            echo ""
            echo "One or more connector definitions are invalid."
            echo "Fix the validation errors above and re-push your changes."
            exit 1
          fi

      - name: Check for required fields
        run: |
          set -e
          FAILED=0

          while IFS= read -r connector_file; do
            dir=$(dirname "$connector_file")
            connector_key=$(node -e "const f=require('$connector_file'); console.log(f.metadata?.key ?? '')")
            license=$(node -e "const f=require('$connector_file'); console.log(f.metadata?.license ?? '')")
            version=$(node -e "const f=require('$connector_file'); console.log(f.metadata?.version ?? '')")

            if [ -z "$license" ]; then
              echo "FAIL: $connector_file is missing metadata.license (SPDX expression required for marketplace connectors)"
              FAILED=$((FAILED + 1))
            fi

            if [ -z "$version" ]; then
              echo "FAIL: $connector_file is missing metadata.version"
              FAILED=$((FAILED + 1))
            fi

            if [ -z "$connector_key" ]; then
              echo "FAIL: $connector_file is missing metadata.key"
              FAILED=$((FAILED + 1))
            fi
          done < <(find marketplace/connectors -name "connector.json" | sort)

          if [ "$FAILED" -gt 0 ]; then
            exit 1
          fi

          echo "All required fields present."
